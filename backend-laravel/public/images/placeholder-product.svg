<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F5"/>
      <stop offset="100%" stop-color="#F5F4EE"/>
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E1915" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Inset -->
  <rect x="12" y="12" width="476" height="476" rx="24" fill="none" stroke="#E7E5E4" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Centered Neutral Product / Garment Graphic Container -->
  <g transform="translate(250, 220)" filter="url(#subtleShadow)">
    <!-- Soft circular backdrop -->
    <circle r="72" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>

    <!-- Neutral Garment Silhouette (Barong / Shirt Contour) -->
    <g fill="none" stroke="#A8A29E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <!-- Collar -->
      <path d="M-20 -28 L0 -14 L20 -28" />
      <path d="M-10 -22 L-10 -8 L10 -8 L10 -22" />
      <!-- Shoulders & Sleeves -->
      <path d="M-20 -28 L-44 -14 L-36 12 L-26 8 L-26 36 L26 36 L26 8 L36 12 L44 -14 L20 -28" />
      <!-- Button Placket & Subtle Embroidery Line -->
      <line x1="0" y1="-8" x2="0" y2="36" stroke-dasharray="2 3"/>
    </g>

    <!-- Small camera/photo badge overlay -->
    <circle cx="26" cy="26" r="16" fill="#F5F4EE" stroke="#D6D3D1" stroke-width="1.5"/>
    <g transform="translate(26, 26) scale(0.65)" fill="none" stroke="#78716C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-10 -5 L-7 -9 L7 -9 L10 -5 L13 -5 A3 3 0 0 1 16 -2 L16 8 A3 3 0 0 1 13 11 L-13 11 A3 3 0 0 1 -16 8 L-16 -2 A3 3 0 0 1 -13 -5 Z"/>
      <circle cx="0" cy="2" r="4.5"/>
    </g>
  </g>

  <!-- Descriptive Text -->
  <text x="250" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#78716C" letter-spacing="0.05em" text-transform="uppercase">
    Photo Unavailable
  </text>
  <text x="250" y="362" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#A8A29E">
    Image is currently being updated
  </text>
</svg>
